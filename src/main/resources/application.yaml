server:
  port: 8090

spring:
  application:
    name: board

  datasource:
    url: jdbc:mysql://localhost:3306/board?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

jwt:
  secret: c2VjcmV0X2tleV9ieV9zYnNfYWNhZGVteV8yMDI2MDcyMV9ib2FyZF9iYWNrX2VuZF9hcHA=
  access-token-validity-seconds: 3600 # 1Hour
  refresh-token-validity-seconds: 36000 # 10Hour

app:
  refresh-cookie:
    name: refreshToken
    secure: false
    same-site: Strict
    path: /api/auth

logging:
  level:
    com.sbs.board: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG




