<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <h1>게시판</h1>
            <p class="subtitle">Spring Bott 백앤드 + Nginx 정적 프론트 - 배포</p>
        </div>
    </header>
    <main class="wrap">
        <div class="toolbar">
            <span id="count" class="count" aria-live="polite"></span>
            <button id="refresh" type="button" class="btn">새로고침</button>
        </div>

        <div id="status" class="status" role="status"></div>
        <ul id="board-list" class="board-list"></ul>
    </main>
    <footer class="site-footer">
        <div class="wrap">
            <span>데이터 출처: <code>GET: /api/board/</code>Nginx 백앤드 프록시</span>
        </div>
    </footer>
    <script src="app.js"></script>
</body>
</html>
